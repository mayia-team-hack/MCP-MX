[project]
name = "mcp-mx"
version = "0.1.0"
description = "MCP server for CDMX open data portal"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "polars>=1.0.0",
    "pyarrow>=16.0.0",
    "pyyaml>=6.0",
    "aiofiles>=23.0.0",
    "beautifulsoup4>=4.14.3",
    "tqdm>=4.67.3",
    "tenacity>=9.1.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["data_ingestion/tests", "scrapers/tests"]
python_files = ["test_*.py"]

[tool.uv]
package = false
